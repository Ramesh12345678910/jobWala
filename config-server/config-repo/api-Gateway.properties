server.port=8085
spring.application.name=API-GATEWAY
spring.main.web-application-type=reactive

# =========================
# SPRING CLOUD GATEWAY ROUTES
# =========================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webflux.routes[1].id=job-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://JOB-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/job/**


spring.cloud.gateway.server.webflux.routes[2].id=profile-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/profile/**

spring.cloud.gateway.server.webflux.routes[3].id=application-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/application/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/email/**


# Swagger UI multiple URLs

springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=job-Service
springdoc.swagger-ui.urls[1].url=/job-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=application-Service
springdoc.swagger-ui.urls[2].url=/application-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=profile-Service
springdoc.swagger-ui.urls[3].url=/profile-service/v3/api-docs




# =========================
# SERVICE DISCOVERY
# =========================

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# =========================
# EUREKA
# =========================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# =========================
# DEBUG (VERY IMPORTANT)
# =========================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=INFO
jwt.secret=YXV0aF9zZXJ2aWNlX3NlY3JldF9rZXlfMjU2X2JpdHNfMTIzNDU=
# Enable/disable API docs
springdoc.api-docs.enabled=true

# Enable/disable Swagger UI
springdoc.swagger-ui.enabled=true

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:8085
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true